<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="bgmi-logo.png">
    <link rel="icon" type="image/png" href="bgmi-logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostel Expense Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="text-slate-800 dark:text-slate-100 bg-slate-100 dark:bg-slate-900 antialiased transition-colors duration-300">

    <div class="max-w-md mx-auto bg-slate-50 dark:bg-slate-900 min-h-screen shadow-2xl flex flex-col justify-between relative overflow-hidden transition-colors duration-300">
        
        <!-- Add Balance Modal -->
        <div id="fundModal" class="hidden absolute inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 transition-all">
            <div class="bg-white dark:bg-slate-800 p-7 rounded-[2rem] w-full shadow-2xl transform scale-100 border border-slate-200 dark:border-slate-700">
                <h3 class="font-bold text-xl mb-5 text-slate-800 dark:text-white flex items-center gap-2">
                    <span class="bg-green-100 dark:bg-green-900/30 text-green-600 dark:text-green-400 p-2 rounded-xl text-lg">💰</span> Add Money
                </h3>
                <div class="space-y-4">
                    <div>
                        <label class="text-xs text-slate-500 dark:text-slate-400 font-semibold mb-1.5 block uppercase tracking-wider">Select Member</label>
                        <select id="fundMember" class="w-full p-3.5 bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-2xl text-sm text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-green-500 transition">
                            <option value="Tanmay">Tanmay</option>
                            <option value="Mrinmay">Mrinmay</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-slate-500 dark:text-slate-400 font-semibold mb-1.5 block uppercase tracking-wider">Amount (₹)</label>
                        <input type="number" id="fundAmount" placeholder="0.00" class="w-full p-3.5 bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-2xl text-lg font-bold text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-green-500 transition">
                    </div>
                    <div class="flex gap-3 mt-6">
                        <button id="closeFundModal" class="w-1/2 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 py-3.5 rounded-2xl font-bold text-sm hover:bg-slate-200 dark:hover:bg-slate-600 transition">Cancel</button>
                        <button id="submitFundBtn" class="w-1/2 bg-gradient-to-r from-green-500 to-emerald-600 text-white py-3.5 rounded-2xl font-bold text-sm hover:shadow-lg hover:shadow-green-500/30 transition">Add Fund</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Deposit History Modal -->
        <div id="historyModal" class="hidden absolute inset-0 bg-slate-900/60 backdrop-blur-sm flex flex-col justify-end z-50 transition-all">
            <div class="bg-white dark:bg-slate-800 p-6 rounded-t-[2rem] w-full shadow-2xl h-[70%] flex flex-col border-t border-slate-200 dark:border-slate-700">
                <div class="flex justify-between items-center mb-5">
                    <h3 class="font-bold text-lg text-slate-800 dark:text-white flex items-center gap-2">
                        <span class="bg-blue-100 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 p-1.5 rounded-lg text-sm">📜</span> Deposit History
                    </h3>
                    <button id="closeHistoryModal" class="bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300 hover:bg-red-100 dark:hover:bg-red-900/50 hover:text-red-500 dark:hover:text-red-400 h-8 w-8 rounded-full flex items-center justify-center font-bold transition">&times;</button>
                </div>
                <div id="depositList" class="overflow-y-auto space-y-3 flex-1 pb-6">
                    <!-- Deposit items will load here -->
                </div>
            </div>
        </div>

        <!-- Header & Balance -->
        <div class="bg-gradient-to-br from-indigo-600 via-blue-600 to-blue-700 text-white p-6 pb-8 rounded-b-[2.5rem] shadow-lg shadow-blue-600/20 z-10 relative">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-extrabold tracking-tight">Hostel Fund</h1>
                    <p class="text-xs text-blue-200 font-medium mt-0.5 opacity-80">Smart Expense Manager</p>
                </div>
                <button id="addFundBtn" class="bg-white/20 hover:bg-white/30 backdrop-blur-md px-4 py-2 rounded-xl transition font-semibold text-sm shadow-sm flex items-center gap-1 border border-white/10">
                    + Add
                </button>
            </div>
            
            <div class="mt-7 bg-white/95 dark:bg-slate-800/95 backdrop-blur-md text-slate-800 dark:text-white p-5 rounded-[2rem] shadow-xl border border-white/50 dark:border-slate-700 relative overflow-hidden transition-colors duration-300">
                <div class="flex justify-between items-center">
                    <p class="text-[10px] text-slate-500 dark:text-slate-400 uppercase font-bold tracking-widest">Total Wallet Balance</p>
                    <button id="viewHistoryBtn" class="text-[10px] bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 px-3 py-1.5 rounded-lg font-bold hover:bg-slate-200 dark:hover:bg-slate-600 transition">
                        History
                    </button>
                </div>
                <h2 id="totalBalance" class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-700 to-indigo-700 dark:from-blue-400 dark:to-indigo-300 mt-1">₹0</h2>
                
                <div class="mt-5 pt-4 border-t border-slate-100 dark:border-slate-700 grid grid-cols-2 gap-3 text-center">
                    <div class="bg-blue-50/50 dark:bg-slate-700/50 p-3 rounded-2xl border border-blue-100/50 dark:border-slate-600/50">
                        <p class="text-[9px] text-slate-500 dark:text-slate-400 font-bold uppercase tracking-wider">Tanmay</p>
                        <p id="tanmayBal" class="text-base font-extrabold text-blue-700 dark:text-blue-400 mt-0.5">₹0</p>
                    </div>
                    <div class="bg-indigo-50/50 dark:bg-slate-700/50 p-3 rounded-2xl border border-indigo-100/50 dark:border-slate-600/50">
                        <p class="text-[9px] text-slate-500 dark:text-slate-400 font-bold uppercase tracking-wider">Mrinmay</p>
                        <p id="mrinmayBal" class="text-base font-extrabold text-indigo-700 dark:text-indigo-400 mt-0.5">₹0</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Expense List -->
        <div class="p-5 flex-1 overflow-y-auto relative z-0">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-slate-800 dark:text-slate-100 text-lg">Expenses</h3>
                <select id="monthFilter" class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 text-xs rounded-xl px-3 py-1.5 outline-none font-semibold shadow-sm focus:ring-2 focus:ring-blue-500 transition">
                    <option value="all">All Months</option>
                </select>
            </div>
            <div id="expenseList" class="space-y-3 pb-4">
                <p class="text-slate-400 text-sm text-center mt-10 font-medium">Loading records...</p>
            </div>
        </div>

        <!-- Expense Form -->
        <div class="bg-white dark:bg-slate-800 border-t border-slate-100 dark:border-slate-800 p-5 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)] dark:shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.3)] z-10 rounded-t-[2.5rem] transition-colors duration-300">
            <h3 class="font-bold text-slate-800 dark:text-slate-100 mb-4 text-sm flex items-center gap-2">
                <span class="bg-red-100 dark:bg-red-900/30 text-red-500 dark:text-red-400 w-6 h-6 rounded-full flex items-center justify-center text-xs">➖</span> Add Expense
            </h3>
            <form id="expenseForm" class="space-y-3">
                <div class="flex gap-3">
                    <input type="number" id="amount" placeholder="Amount (₹)" required
                        class="w-1/2 p-3.5 bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-2xl text-sm font-bold text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-red-400 transition">
                    <select id="paidBy" class="w-1/2 p-3.5 bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-2xl text-sm font-medium text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-red-400 transition">
                        <option value="Tanmay">Tanmay</option>
                        <option value="Mrinmay">Mrinmay</option>
                    </select>
                </div>
                <div>
                    <input type="text" id="note" placeholder="What was this for? (e.g. Bazar)" required
                        class="w-full p-3.5 bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-2xl text-sm font-medium text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-red-400 transition">
                </div>
                <button type="submit" id="submitBtn"
                    class="w-full bg-gradient-to-r from-red-500 to-rose-600 text-white py-4 rounded-2xl font-bold text-sm hover:shadow-lg hover:shadow-red-500/30 transition-all active:scale-[0.98]">
                    Cut from Balance
                </button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCwv7bNt8RpUFSfKf-1YtzcfPukP7So4",
            authDomain: "hostelexpense-c5dd8.firebaseapp.com",
            projectId: "hostelexpense-c5dd8",
            storageBucket: "hostelexpense-c5dd8.firebasestorage.app",
            messagingSenderId: "992900368817",
            appId: "1:992900368817:web:ac8865f1685e8ec51c9590"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const totalBalanceEl = document.getElementById('totalBalance');
        const tanmayBalEl = document.getElementById('tanmayBal');
        const mrinmayBalEl = document.getElementById('mrinmayBal');
        const expenseListEl = document.getElementById('expenseList');
        const depositListEl = document.getElementById('depositList');
        const expenseForm = document.getElementById('expenseForm');
        const monthFilterEl = document.getElementById('monthFilter');
        
        const addFundBtn = document.getElementById('addFundBtn');
        const fundModal = document.getElementById('fundModal');
        const closeFundModal = document.getElementById('closeFundModal');
        const submitFundBtn = document.getElementById('submitFundBtn');
        
        const viewHistoryBtn = document.getElementById('viewHistoryBtn');
        const historyModal = document.getElementById('historyModal');
        const closeHistoryModal = document.getElementById('closeHistoryModal');

        let selectedMonth = "all";

        addFundBtn.addEventListener('click', () => fundModal.classList.remove('hidden'));
        closeFundModal.addEventListener('click', () => fundModal.classList.add('hidden'));
        viewHistoryBtn.addEventListener('click', () => historyModal.classList.remove('hidden'));
        closeHistoryModal.addEventListener('click', () => historyModal.classList.add('hidden'));

        monthFilterEl.addEventListener('change', (e) => {
            selectedMonth = e.target.value;
            calculateAndUpdateUI();
        });

        async function initData() {
            const q = query(collection(db, "expenses"), orderBy("timestamp", "desc"));
            onSnapshot(q, (snapshot) => {
                window.currentExpenses = [];
                snapshot.forEach((docItem) => {
                    window.currentExpenses.push({ id: docItem.id, ...docItem.data() });
                });
                updateMonthDropdown();
                calculateAndUpdateUI();
            });
        }

        function updateMonthDropdown() {
            const uniqueMonths = new Set();
            window.currentExpenses.forEach(item => {
                if(item.timestamp) {
                    const d = item.timestamp.toDate ? item.timestamp.toDate() : new Date(item.timestamp);
                    const monthYear = d.toLocaleString('en-IN', { month: 'short', year: 'numeric' });
                    uniqueMonths.add(monthYear);
                }
            });

            const currentVal = monthFilterEl.value;
            monthFilterEl.innerHTML = `<option value="all">All Months</option>`;
            
            const monthsArr = Array.from(uniqueMonths);
            monthsArr.forEach(m => {
                monthFilterEl.innerHTML += `<option value="${m}">${m}</option>`;
            });

            if(uniqueMonths.has(currentVal)) {
                monthFilterEl.value = currentVal;
                selectedMonth = currentVal;
            } else if(monthsArr.length > 0 && selectedMonth === "all") {
                selectedMonth = monthsArr[0];
                monthFilterEl.value = selectedMonth;
            }
        }

        function calculateAndUpdateUI() {
            let tanmayBal = 0, mrinmayBal = 0;
            expenseListEl.innerHTML = '';
            depositListEl.innerHTML = '';

            let hasExpenses = false, hasDeposits = false;

            if (window.currentExpenses) {
                window.currentExpenses.forEach(item => {
                    let name = item.paidBy ? item.paidBy.toLowerCase() : "";
                    let amt = Number(item.amount);
                    let isDeposit = item.type === "deposit";

                    if (name.includes("tanmay")) {
                        if (isDeposit) tanmayBal += amt; else tanmayBal -= amt;
                    } else if (name.includes("mrinmay")) {
                        if (isDeposit) mrinmayBal += amt; else mrinmayBal -= amt;
                    }

                    let formattedDate = "Just now";
                    let itemMonthYear = "";
                    if (item.timestamp) {
                        const dateObj = item.timestamp.toDate ? item.timestamp.toDate() : new Date(item.timestamp);
                        formattedDate = dateObj.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) + ' ' + dateObj.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
                        itemMonthYear = dateObj.toLocaleString('en-IN', { month: 'short', year: 'numeric' });
                    }

                    if (selectedMonth !== "all" && itemMonthYear !== selectedMonth) {
                        return;
                    }

                    let itemHtml = `
                        <div class="flex justify-between items-center p-4 bg-white dark:bg-slate-800 rounded-2xl border border-slate-100 dark:border-slate-700 shadow-sm hover:shadow-md transition-shadow">
                            <div class="flex items-center gap-3">
                                <div class="h-10 w-10 rounded-full flex items-center justify-center ${isDeposit ? 'bg-emerald-100 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400' : 'bg-rose-100 dark:bg-rose-900/30 text-rose-500 dark:text-rose-400'} text-lg font-black">
                                    ${isDeposit ? '↓' : '↑'}
                                </div>
                                <div>
                                    <p class="font-bold text-sm text-slate-800 dark:text-slate-100">${item.note}</p>
                                    <div class="flex items-center gap-2 mt-0.5">
                                        <p class="text-[11px] text-slate-500 dark:text-slate-400 font-medium">${isDeposit ? 'Added by' : 'Paid by'}: <span class="font-bold text-slate-700 dark:text-slate-300">${item.paidBy}</span></p>
                                        <span class="text-[9px] font-semibold text-slate-400 dark:text-slate-500 bg-slate-100 dark:bg-slate-700/50 px-1.5 py-0.5 rounded pl-1">📅 ${formattedDate}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="text-right flex flex-col items-end gap-1">
                                <span class="font-black ${isDeposit ? 'text-emerald-500 dark:text-emerald-400' : 'text-rose-500 dark:text-rose-400'} text-[15px]">${isDeposit ? '+' : '-'}₹${item.amount}</span>
                                <button onclick="deleteExpense('${item.id}')" class="text-[10px] text-slate-400 dark:text-slate-500 hover:text-red-500 dark:hover:text-red-400 font-semibold transition-colors">Delete</button>
                            </div>
                        </div>
                    `;

                    if (isDeposit) {
                        depositListEl.innerHTML += itemHtml;
                        hasDeposits = true;
                    } else {
                        expenseListEl.innerHTML += itemHtml;
                        hasExpenses = true;
                    }
                });
            }

            tanmayBalEl.innerText = `₹ ${tanmayBal}`;
            mrinmayBalEl.innerText = `₹ ${mrinmayBal}`;
            totalBalanceEl.innerText = `₹ ${tanmayBal + mrinmayBal}`;

            if (!hasExpenses) expenseListEl.innerHTML = `<p class="text-slate-400 text-sm text-center mt-10 font-medium">No expenses found for this month.</p>`;
            if (!hasDeposits) depositListEl.innerHTML = `<p class="text-slate-400 text-sm text-center mt-10 font-medium">No deposits found for this month.</p>`;
        }

        window.deleteExpense = async function(id) {
            if (confirm("Are you sure you want to delete this record?")) {
                await deleteDoc(doc(db, "expenses", id));
            }
        }

        submitFundBtn.addEventListener('click', async function() {
            const amount = parseFloat(document.getElementById('fundAmount').value);
            const paidBy = document.getElementById('fundMember').value;
            if(!amount) return;

            submitFundBtn.innerText = "Adding...";
            await addDoc(collection(db, "expenses"), { amount, paidBy, note: "💰 Money Added to Wallet", type: "deposit", timestamp: new Date() });
            
            document.getElementById('fundAmount').value = '';
            fundModal.classList.add('hidden');
            submitFundBtn.innerText = "Add Fund";
        });

        expenseForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const amount = parseFloat(document.getElementById('amount').value);
            const paidBy = document.getElementById('paidBy').value;
            const note = document.getElementById('note').value;

            document.getElementById('submitBtn').innerText = "Processing...";
            await addDoc(collection(db, "expenses"), { amount, paidBy, note, type: "expense", timestamp: new Date() });

            document.getElementById('amount').value = '';
            document.getElementById('note').value = '';
            document.getElementById('submitBtn').innerText = "Cut from Balance";
        });

        initData();
    </script>
</body>
</html>
